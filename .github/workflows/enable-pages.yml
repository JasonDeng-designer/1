name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from main /
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          post_code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d "$payload")
          echo "POST ${post_code}"
          cat /tmp/pages.json
          echo
          if [ "$post_code" = "201" ] || [ "$post_code" = "200" ]; then
            exit 0
          fi
          put_code=$(curl -sS -o /tmp/pages-put.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d "$payload")
          echo "PUT ${put_code}"
          cat /tmp/pages-put.json
          echo
          if [ "$put_code" = "200" ] || [ "$put_code" = "201" ]; then
            exit 0
          fi
          exit 1
